# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Application Name ──────────────────────────────────────────────────────────
spring.application.name=doc-summary-assistant

# ── File Upload Limits ────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── OpenRouter API Key & Model ───────────────────────────────────────────────
# Loaded from .env file automatically via spring-dotenv
# Falls back to OS environment variable OPENROUTER_API_KEY if .env is absent
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:stealth/ox-alpha}

# ── Tesseract Data Path ────────────────────────────────────────────────────────
# Loaded from .env file (TESSDATA_PREFIX key)
tesseract.datapath=${TESSDATA_PREFIX:tessdata}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.docsummary=INFO
logging.level.org.springframework.web=WARN
